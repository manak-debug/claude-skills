name: Publish notfair-nextjs-blog to npm

# Publishes the Next.js blog client when notfair-nextjs-blog/package.json
# lands on main with a version that isn't on the registry yet. Bump the
# version in a normal commit and push — no tags or releases to manage.
# Re-runs on an already-published version are a clean no-op.
on:
  push:
    branches: [main]
    paths:
      - "notfair-nextjs-blog/**"
  workflow_dispatch:

concurrency:
  group: npm-publish-nextjs-blog
  cancel-in-progress: false

jobs:
  publish:
    # macos-14 matches the main notfair publish workflow — ubuntu-latest jobs
    # were never acquired by a hosted runner in this org (see run 31127380316).
    runs-on: macos-14
    defaults:
      run:
        working-directory: notfair-nextjs-blog
    steps:
      - uses: actions/checkout@v4

      # registry-url makes setup-node write an ~/.npmrc that reads
      # NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Skip if this version is already on npm
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view notfair-nextjs-blog version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.skip != 'true'
        run: npm install

      - name: Test and build
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Publish ${{ steps.version.outputs.local }}
        if: steps.version.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
